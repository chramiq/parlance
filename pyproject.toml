[project]
name = "parlance"
version = "0.1.0"
description = "A way to actually learn a language."
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai>=2",
    "genanki>=0.13",
    "typer>=0.12",
    "pydantic-settings>=2",
    "simplemma>=2",
    "edge-tts>=7",
    "httpx>=0.28.1",
    "google-genai>=2.22.0",
    "sounddevice>=0.5.6",
]

[project.scripts]
parlance = "parlance.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parlance"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "ty>=0.0.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
